services:
  - type: web
    name: medpath-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: postgresql://medpath_ai_user:0xpiIEJp7K6JBvPbsBqkmQShUodCfroD@dpg-d9iqrvnaqgkc73ah7lf0-a/medpath_ai
      - key: JWT_SECRET
        value: your-super-secret-jwt-key-change-this-in-production
      - key: NODE_ENV
