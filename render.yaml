databases:
  - name: medpath-db
    plan: free
    region: oregon

services:
  - type: web
    name: medpath-api
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medpath-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_QUERIES
        value: "false"
